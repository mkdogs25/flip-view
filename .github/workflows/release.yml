name: Release

# Every push to main builds the plugin. If the version in manifest.json has no release yet,
# a release (and tag) with exactly that version is created, with main.js, manifest.json and
# styles.css attached. That is what BRAT installs. Bump the version with `npm run bump`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${{ steps.v.outputs.version }} is already released. Run 'npm run bump' to publish new changes."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes $flags
